[tool.setuptools]
packages = ["app"]

[project]
name = "dredge"
version = "0.1.0"
description = "Docker FinOps & Lifecycle Management Tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "taskiq",
    "sqlmodel",
    "jinja2",
    "docker",
    "python-multipart",
    "apprise",
    "boto3",
    "google-auth",
    "requests",
    "cryptography",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "apscheduler",
    "prometheus-fastapi-instrumentator",
    "prometheus-client",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "pytest-asyncio",
]
