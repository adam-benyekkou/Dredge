<div class="card">
    <header>
        <h3 style="margin-bottom: 0;">FinOps Configuration</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Adjust cost estimation parameters.</p>
    </header>
    
    <form hx-post="/settings" hx-target="#settings-content" hx-push-url="false">
        <input type="hidden" name="section" value="finops">
        
        <label for="provider_name">Cloud Provider
            <select id="provider_name" name="provider_name" onchange="updatePrice()">
                <option value="AWS" {% if settings.provider_name == 'AWS' %}selected{% endif %}>Amazon Web Services (ECR)</option>
                <option value="Azure" {% if settings.provider_name == 'Azure' %}selected{% endif %}>Microsoft Azure (ACR)</option>
                <option value="GCP" {% if settings.provider_name == 'GCP' %}selected{% endif %}>Google Cloud (GCR/GAR)</option>
                <option value="Docker Hub" {% if settings.provider_name == 'Docker Hub' %}selected{% endif %}>Docker Hub</option>
                <option value="GHCR" {% if settings.provider_name == 'GHCR' %}selected{% endif %}>GitHub Packages (GHCR)</option>
                <option value="GitHub HRC" {% if settings.provider_name == 'GitHub HRC' %}selected{% endif %}>GitHub Actions Cache / HRC</option>
                <option value="Custom" {% if settings.provider_name == 'Custom' %}selected{% endif %}>Custom / On-Premise</option>
            </select>
        </label>

        <div class="grid">
            <label for="custom_price_per_gb">Price per GB ($/month)
                <input type="number" id="custom_price_per_gb" name="custom_price_per_gb" step="0.001" value="{{ settings.custom_price_per_gb }}">
                <small id="price-hint" style="color: var(--text-muted);">Select a provider to auto-fill default pricing</small>
            </label>
            <label for="currency_symbol">Currency
                <select id="currency_symbol" name="currency_symbol">
                    <option value="$" {% if settings.currency_symbol == '$' %}selected{% endif %}>USD ($)</option>
                    <option value="€" {% if settings.currency_symbol == '€' %}selected{% endif %}>EUR (€)</option>
                    <option value="£" {% if settings.currency_symbol == '£' %}selected{% endif %}>GBP (£)</option>
                </select>
            </label>
        </div>

        <div class="grid" style="margin-top: 1rem;">
            <label for="monthly_budget">Monthly Budget Goal
                <input type="number" id="monthly_budget" name="monthly_budget" step="0.01" value="{{ settings.monthly_budget }}">
                <small>Alert when monthly cost forecast exceeds this amount (0 to disable)</small>
            </label>
            <div style="flex: 1;"></div>
        </div>

        <footer style="margin-top: 1rem;">
            <button type="submit" class="primary">Save Configuration</button>
            {% if updated %}
                <span style="color: #2ECC71; margin-left: 1rem; font-size: 0.9rem;">✓ Settings saved</span>
            {% endif %}
        </footer>
    </form>
</div>

<script>
    const PROVIDER_PRICES = {
        "AWS":        0.10,
        "Azure":      0.09,
        "GCP":        0.026,
        "Docker Hub": 0.00,
        "GHCR":       0.25,
        "GitHub HRC": 0.07,
        "Custom":     0.10
    };

    function updatePrice() {
        const provider = document.getElementById('provider_name').value;
        const priceInput = document.getElementById('custom_price_per_gb');
        const hint = document.getElementById('price-hint');
        
        if (PROVIDER_PRICES.hasOwnProperty(provider)) {
            const defaultPrice = PROVIDER_PRICES[provider];
            priceInput.value = defaultPrice;
            hint.textContent = 'Default: $' + defaultPrice.toFixed(3) + '/GB/month (' + provider + ')';
        }
    }

    // Set hint on page load based on current provider
    (function() {
        const provider = document.getElementById('provider_name').value;
        const hint = document.getElementById('price-hint');
        if (PROVIDER_PRICES.hasOwnProperty(provider)) {
            const defaultPrice = PROVIDER_PRICES[provider];
            hint.textContent = 'Default: $' + defaultPrice.toFixed(3) + '/GB/month (' + provider + ')';
        }
    })();
</script>
