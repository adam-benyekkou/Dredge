<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dredge - Docker FinOps{% endblock %}</title>
    
    <!-- PicoCSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <style>
        :root {
            /* Deep Harbor Theme */
            --pico-background-color: #0D1B2A;
            --pico-card-background-color: #1B263B;
            --pico-primary: #0077B6;
            --pico-primary-hover: #0096C7;
            --pico-color: #E0E1DD;
            --accent: #48CAE4;
            --danger: #D97D54;
            --text-muted: #778DA9;
        }
        
        body {
            display: grid;
            grid-template-columns: 250px 1fr;
            height: 100vh;
            margin: 0;
            background-color: var(--pico-background-color);
            color: var(--pico-color);
        }
        
        .sidebar {
            background-color: var(--pico-card-background-color);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--text-muted);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--pico-primary), var(--accent));
            border-radius: 50%;
        }
        
        .logo-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }
        
        .nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .nav a {
            padding: 0.75rem;
            border-radius: 4px;
            text-decoration: none;
            color: var(--pico-color);
            transition: background-color 0.2s;
        }
        
        .nav a:hover, .nav a.active {
            background-color: var(--pico-primary);
        }
        
        .sidebar-footer {
            padding-top: 1rem;
            border-top: 1px solid var(--text-muted);
        }
        
        .server-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent);
        }
        
        .main-content {
            overflow-y: auto;
            padding: 2rem;
        }
        
        .container {
            max-width: 1400px;
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"></div>
            <span class="logo-text">Dredge</span>
        </div>
        
        <nav class="nav">
            <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Dashboard</a>
            <a href="/images" {% if request.url.path == "/images" %}class="active"{% endif %}>Images</a>
            <a href="/volumes" {% if request.url.path == "/volumes" %}class="active"{% endif %}>Volumes</a>
            <a href="/policies" {% if request.url.path == "/policies" %}class="active"{% endif %}>Policies</a>
            <a href="/logs" {% if request.url.path == "/logs" %}class="active"{% endif %}>Logs</a>
        </nav>
        
        <div class="sidebar-footer">
            <select>
                <option selected>Local Socket</option>
                <option>Remote Registry</option>
            </select>
            
            <div class="server-status">
                <span class="status-indicator"></span>
                <span>Connected</span>
            </div>
        </div>
    </aside>
    
    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
